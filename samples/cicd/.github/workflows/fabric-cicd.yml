name: Fabric CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: fabric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          curl -fsSL https://raw.githubusercontent.com/iemejia/fabio/main/install.sh | bash

      - name: Lint and test the notebook source
        run: |
          ruff check fabric-items tests
          python -m unittest discover -s tests

      - name: Validate Fabric definitions
        run: |
          fabio deploy validate --source ./fabric-items \
            --parameters ./parameters.json --env preview
          fabio report validate --source ./fabric-items/SalesReport.Report

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Fabio
        run: curl -fsSL https://raw.githubusercontent.com/iemejia/fabio/main/install.sh | bash

      - name: Sign in with GitHub OIDC
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" |
            jq -r '.value')"
          fabio auth login \
            --tenant "$AZURE_TENANT_ID" \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-token "$OIDC_TOKEN"

      - name: Recreate the pull request workspace
        id: workspace
        env:
          DEV_CAPACITY_ID: ${{ vars.FABRIC_DEV_CAPACITY_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WS_NAME="${GITHUB_REPOSITORY#*/}-pr-${PR_NUMBER}"
          EXISTING_ID="$(fabio workspace list |
            jq -r --arg name "$WS_NAME" \
              '.data[] | select(.displayName == $name) | .id' |
            head -n 1)"
          if [ -n "$EXISTING_ID" ]; then
            fabio workspace delete --id "$EXISTING_ID"
          fi

          CREATE_RESULT="$(fabio workspace create \
            --name "$WS_NAME" \
            --description "Ephemeral preview for ${GITHUB_REPOSITORY}#${PR_NUMBER}" \
            --capacity-id "$DEV_CAPACITY_ID")"
          WS_ID="$(jq -r '.data.id' <<<"$CREATE_RESULT")"
          echo "id=$WS_ID" >> "$GITHUB_OUTPUT"

      - name: Plan the preview deployment
        env:
          WS_ID: ${{ steps.workspace.outputs.id }}
        run: |
          fabio deploy plan --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env preview \
            --out "$RUNNER_TEMP/deploy-plan.json"

      - name: Deploy data preparation items
        env:
          WS_ID: ${{ steps.workspace.outputs.id }}
        run: |
          fabio deploy apply --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env preview \
            --item-types Lakehouse,Notebook --no-post-hooks

          NOTEBOOK_ID="$(fabio notebook list --workspace "$WS_ID" |
            jq -r '.data[] | select(.displayName == "LoadSales") | .id')"
          fabio notebook run --workspace "$WS_ID" \
            --id "$NOTEBOOK_ID" --wait --timeout 1200

      - name: Deploy and verify the complete solution
        env:
          WS_ID: ${{ steps.workspace.outputs.id }}
        run: |
          fabio deploy apply --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env preview \
            --verify

      - name: Comment with the preview workspace
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          WS_ID: ${{ steps.workspace.outputs.id }}
        with:
          script: |
            const marker = '<!-- fabio-preview-workspace -->';
            const url = `https://app.fabric.microsoft.com/groups/${process.env.WS_ID}`;
            const body = `${marker}\n✅ Fabric preview deployed: [open the PR workspace](${url}).`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Install Fabio
        run: curl -fsSL https://raw.githubusercontent.com/iemejia/fabio/main/install.sh | bash

      - name: Sign in with GitHub OIDC
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" |
            jq -r '.value')"
          fabio auth login \
            --tenant "$AZURE_TENANT_ID" \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-token "$OIDC_TOKEN"

      - name: Delete the pull request workspace
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WS_NAME="${GITHUB_REPOSITORY#*/}-pr-${PR_NUMBER}"
          WS_ID="$(fabio workspace list |
            jq -r --arg name "$WS_NAME" \
              '.data[] | select(.displayName == $name) | .id' |
            head -n 1)"
          if [ -n "$WS_ID" ]; then
            fabio workspace delete --id "$WS_ID"
          fi

      - name: Mark the preview as deleted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const marker = '<!-- fabio-preview-workspace -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: `${marker}\n🧹 Fabric preview workspace deleted.`,
              });
            }

  production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Fabio
        run: curl -fsSL https://raw.githubusercontent.com/iemejia/fabio/main/install.sh | bash

      - name: Sign in with GitHub OIDC
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" |
            jq -r '.value')"
          fabio auth login \
            --tenant "$AZURE_TENANT_ID" \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-token "$OIDC_TOKEN"

      - name: Plan the production deployment
        env:
          WS_ID: ${{ vars.FABRIC_PROD_WORKSPACE_ID }}
        run: |
          fabio deploy plan --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env production \
            --out "$RUNNER_TEMP/deploy-plan.json"

      - name: Deploy data preparation items
        env:
          WS_ID: ${{ vars.FABRIC_PROD_WORKSPACE_ID }}
        run: |
          fabio deploy apply --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env production \
            --item-types Lakehouse,Notebook --no-post-hooks

          NOTEBOOK_ID="$(fabio notebook list --workspace "$WS_ID" |
            jq -r '.data[] | select(.displayName == "LoadSales") | .id')"
          fabio notebook run --workspace "$WS_ID" \
            --id "$NOTEBOOK_ID" --wait --timeout 1200

      - name: Deploy and verify the complete solution
        env:
          WS_ID: ${{ vars.FABRIC_PROD_WORKSPACE_ID }}
        run: |
          fabio deploy apply --source ./fabric-items \
            --workspace "$WS_ID" \
            --parameters ./parameters.json --env production \
            --verify
